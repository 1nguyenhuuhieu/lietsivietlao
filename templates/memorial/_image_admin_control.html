{% if request.user.is_superuser %}<form class="home-image-admin {{ control_class|default:'' }}" method="post" action="{% url 'replace_home_image' %}" enctype="multipart/form-data" onclick="event.stopPropagation()">{% csrf_token %}<input type="hidden" name="key" value="{{ image_key }}"><label><input type="file" name="image" accept="image/jpeg,image/png,image/webp" required onchange="this.form.submit()"><span aria-hidden="true">↻</span>{{ control_label|default:'Thay ảnh' }}</label></form>{% endif %}
